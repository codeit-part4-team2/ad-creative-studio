name: tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - name: Test publishing UI state rules
        run: node --test web-tests/publishing-state.test.mjs
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Verify FFmpeg runtime
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Compile Python sources
        run: python -m compileall -q app tools
      - run: pytest -q
      - name: Notebook Sanity Check
        run: |
          pip install nbstripout
          if find . -name "*.ipynb" -not -path "./.git/*" | grep -q .; then
            nbstripout --verify $(find . -name "*.ipynb" -not -path "./.git/*")
          else
            echo "노트북 파일 없음 - 스킵"
          fi
