[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "small-appliance-ad-service"
version = "0.1.0"
description = "쇼핑몰 입점 소형가전 소상공인을 위한 AI 광고 콘텐츠 생성 서비스"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "httpx",
    "openai",
    "pillow==12.2.0",
    "requests",
    "google-api-python-client==2.198.0",
    "google-auth-oauthlib==1.4.0",
    "google-auth-httplib2==0.4.1",
]

[project.optional-dependencies]
dev = ["pytest", "nbstripout"]
frontend = ["streamlit>=1.27", "requests", "pillow"]  # streamlit>=1.27: st.switch_page 사용
model = [
    "accelerate>=1,<2",
    "diffusers==0.39.0",
    "numpy>=2.3,<3",
    "opencv-python-headless>=4.10,<6",
    "peft>=0.17,<1",
    "rembg[gpu]>=2.0.75,<3",
    "safetensors>=0.8,<1",
    "transformers>=4.41.2,<6",
]
video = [
    "pillow==12.2.0",
    "google-api-python-client==2.198.0",
    "google-auth-oauthlib==1.4.0",
    "google-auth-httplib2==0.4.1",
]
tts = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "numpy==1.26.4",
    "librosa==0.10.2.post1",
    "soundfile==0.14.0",
    "cached_path==1.8.10",
    "transformers==4.41.2",
    "setuptools==80.9.0",
    "num2words==0.5.12",
    "unidic_lite==1.0.8",
    "mecab-python3==1.0.9",
    "fugashi==1.5.2",
    "pykakasi==2.2.1",
    "g2p_en==2.1.0",
    "anyascii==0.3.2",
    "jamo==0.4.1",
    "gruut==2.2.3",
    "g2pkk==0.1.2",
    "pydub==0.25.1",
    "eng_to_ipa==0.0.2",
    "inflect==7.0.0",
    "unidecode==1.3.7",
    "pypinyin==0.50.0",
    "cn2an==0.5.22",
    "jieba==0.42.1",
    "langid==1.1.6",
    "tqdm==4.70.0",
    "loguru==0.7.2",
    "txtsplit==1.0.0",
    "eunjeon==0.4.0; sys_platform == 'win32'",
    "python-mecab-ko==1.3.7; sys_platform != 'win32'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "model_server*"]
exclude = ["model_server.experiments*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 실제 버그가 될 수 있는 것만: 문법 오류(E9), 논리 오류(F, pyflakes - 미사용/미정의 변수 등)
# import 정렬(I001) 같은 순수 스타일 규칙은 팀 전체 PR에 불필요한 노이즈를 만들어서 제외
select = ["E9", "F"]
