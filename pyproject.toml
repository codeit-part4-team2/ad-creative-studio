[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "small-appliance-ad-service"
version = "0.1.0"
description = "쇼핑몰 입점 소형가전 소상공인을 위한 AI 광고 콘텐츠 생성 서비스"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "httpx",
    "openai",
    "pillow",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "nbstripout"]
frontend = ["streamlit>=1.27", "requests", "pillow"]  # streamlit>=1.27: st.switch_page 사용
model = [
    "accelerate>=1,<2",
    "diffusers==0.39.0",
    "numpy>=2.3,<3",
    "opencv-python-headless>=4.10,<6",
    "peft>=0.17,<1",
    "rembg[gpu]>=2.0.75,<3",
    "safetensors>=0.8,<1",
    "transformers>=4.41.2,<6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*", "model_server*"]
exclude = ["model_server.experiments*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 실제 버그가 될 수 있는 것만: 문법 오류(E9), 논리 오류(F, pyflakes - 미사용/미정의 변수 등)
# import 정렬(I001) 같은 순수 스타일 규칙은 팀 전체 PR에 불필요한 노이즈를 만들어서 제외
select = ["E9", "F"]
